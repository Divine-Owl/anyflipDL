<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>AnyflipDL - Social Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1280px;
      height: 640px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 1280px;
      height: 640px;
      display: flex;
      align-items: center;
      padding: 60px 80px;
      gap: 60px;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #f1f5f9;
    }

    .tagline {
      font-size: 24px;
      font-weight: 400;
      color: #94a3b8;
      line-height: 1.4;
    }

    .badges {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(27, 169, 176, 0.15);
      border: 1px solid rgba(27, 169, 176, 0.3);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #3fbccc;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1ba9b0;
    }

    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screenshot-frame {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 16 / 10;
      background: #1e293b;
      border-radius: 16px;
      border: 2px solid #334155;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screenshot-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .screenshot-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #64748b;
    }

    .screenshot-placeholder svg {
      width: 48px;
      height: 48px;
      opacity: 0.5;
    }

    .screenshot-placeholder span {
      font-size: 14px;
    }

    .window-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: #0f172a;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .window-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .window-dot.red { background: #ef4444; }
    .window-dot.yellow { background: #f59e0b; }
    .window-dot.green { background: #10b981; }

    .window-title {
      margin-left: 12px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">
        <div class="logo-icon">
          <img src="src-tauri/icons/source-logo.png" alt="AnyflipDL Logo">
        </div>
        <span class="logo-text">AnyflipDL</span>
      </div>
      <div class="tagline">
        Download Anyflip documents<br>as PDF or EPUB
      </div>
      <div class="badges">
        <div class="badge"><span class="badge-dot"></span> Tauri 2</div>
        <div class="badge"><span class="badge-dot"></span> Svelte 5</div>
        <div class="badge"><span class="badge-dot"></span> Rust</div>
        <div class="badge"><span class="badge-dot"></span> MIT License</div>
      </div>
    </div>
    <div class="right">
      <div class="screenshot-frame">
        <div class="window-bar">
          <div class="window-dot red"></div>
          <div class="window-dot yellow"></div>
          <div class="window-dot green"></div>
          <span class="window-title">AnyflipDL</span>
        </div>
        <!-- Replace src with your screenshot path -->
        <img src="screenshots/screenshot.png" alt="AnyflipDL Screenshot"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="screenshot-placeholder" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5a2.25 2.25 0 002.25-2.25V5.25a2.25 2.25 0 00-2.25-2.25H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z" />
          </svg>
          <span>Add screenshot to screenshots/screenshot.png</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
